<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectra Event Organizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* Variabel Warna Utama untuk Mode Terang (Default) */
        :root {
            --bg-body: #ffffff; /* Background murni PUTIH saja, hapus warna-warni */
            --bg-sidebar: rgba(118, 75, 162, 0.1); /* Sidebar ungu transparan sangat tipis */
            --border-sidebar: rgba(118, 75, 162, 0.15);
            --text-nav: #4a148c; /* Teks menu ungu gelap */
            --bg-container: rgba(20, 20, 20, 0.92); /* Papan teks tengah HITAM mewah */
            --text-main: #ffffff; /* Teks di dalam papan hitam berwarna PUTIH agar kontras */
            --box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        /* Variabel Warna untuk Mode Gelap (Saat tombol mode diklik) */
        .dark-mode {
            --bg-body: #121212; /* Background utama menjadi hitam pekat */
            --bg-sidebar: rgba(255, 255, 255, 0.05); 
            --border-sidebar: rgba(255, 255, 255, 0.1);
            --text-nav: #ffffff; /* Teks menu menjadi putih */
            --bg-container: rgba(35, 35, 35, 0.95); /* Papan teks tengah menjadi abu-abu gelap */
            --text-main: #e0e0e0;
            --box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            background-color: var(--bg-body);
            color: var(--text-main);
            box-sizing: border-box;
            transition: background-color 0.4s ease, color 0.4s ease; 
        }

        /* --- STYLING SIDEBAR (MENU SEBELAH KIRI) --- */
        nav {
            width: 260px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid var(--border-sidebar);
            box-shadow: 4px 0 25px rgba(0,0,0,0.02);
            position: fixed;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between; /* Menjaga tombol mode tetap di bawah */
            transition: background 0.4s ease, border 0.4s ease;
        }

        .menu-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .sidebar-brand {
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-sidebar);
            padding-bottom: 15px;
            color: var(--text-nav);
            transition: color 0.4s ease;
        }

        nav a {
            color: var(--text-nav);
            text-decoration: none;
            font-weight: 500;
            padding: 12px 20px;
            border-radius: 12px;
            transition: 0.3s ease, color 0.4s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.05rem;
        }

        nav a i {
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }

        nav a:hover {
            background: rgba(118, 75, 162, 0.08);
            transform: translateX(5px);
        }

        nav a.active {
            background: #764ba2; /* Tombol menu aktif tetap bernuansa ungu khas Spectra */
            color: white !important;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.2);
        }

        /* --- TOMBOL PENGGANTI MODE (DARK/LIGHT) --- */
        .theme-toggle-btn {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            transition: 0.3s ease;
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.2);
            width: 100%;
        }
        .theme-toggle-btn:hover {
            background: #5a3485;
            transform: scale(1.02);
        }

        /* --- STYLING KONTEN UTAMA --- */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
        }

        /* PAPAN TEKS TENGAH BERWARNA HITAM */
        .container {
            width: 100%;
            max-width: 750px;
            padding: 2.5rem;
            background: var(--bg-container);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--
