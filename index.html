<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Spectra Jaya Abadi - Official Website</title>

    <style>
        /* --- UTILITY RESET & DASAR --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #222222;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- SPLASH SCREEN ANIMASI MASUK --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #4a148c; /* Warna ungu gelap premium */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
            animation: lunturLayar 0.6s ease 3.2s forwards;
        }

        .welcome-box {
            text-align: center;
            border: 3px solid #ffffff;
            padding: 25px 40px;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: wadahMuncul 1.5s ease-out forwards;
        }

        .welcome-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.4;
        }

        @keyframes wadahMuncul {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes lunturLayar {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; display: none !important; }
        }

        /* --- TATA LETAK UTAMA (LAYOUT RESPONSIVE) --- */
        .wrapper {
            display: flex;
            flex-direction: column; /* Default HP: Vertikal meleret ke bawah */
            width: 100%;
            flex: 1;
        }

        /* --- SIDEBAR KIRI (PADA HP AKAN DI ATAS) --- */
        nav {
            width: 100%;
            background: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 2px solid #eaeaea;
        }

        .logo-box {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-box img {
            width: 100px;
            height: auto;
            border-radius: 50%;
            border: 3px solid #4a148c;
            padding: 3px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .logo-box h2 {
            font-size: 1.2rem;
            color: #333333;
            margin-top: 8px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px; /* Batasi lebar di layar kecil */
        }

        nav button {
            background: #764ba2;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            width: 100%;
        }

        nav button i {
            width: 20px;
            text-align: center;
        }

        nav button:hover {
            background: #5e35b1;
            transform: translateX(3px);
        }

        nav button.active {
            background: #4a148c !important;
            box-shadow: 0 4px 12px rgba(74, 20, 140, 0.3);
        }

        /* --- KONTEN SEBELAH KANAN --- */
        .main-container {
            flex: 1;
            padding: 20px;
            background: #ffffff;
        }

        .page-content {
            display: none; /* Disembunyikan, nanti muncul sesuai tombol */
            animation: efekPudar 0.4s ease-in-out forwards;
        }

        @keyframes efekPudar {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --- STRUKTUR PANEL GRID / MODEL TIANG (PERSIS GAMBAR DESAIN) --- */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr; /* Default HP: 1 kolom panjang kebawah */
            gap: 30px;
            margin-top: 15px;
        }

        .title-main {
            font-size: 1.8rem;
            font-weight: 800;
            color: #111111;
            margin-bottom: 5px;
        }
