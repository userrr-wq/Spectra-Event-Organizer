<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Spectra Jaya Abadi - Official Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* --- UTILITY RESET & DASAR --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #222222;
            display: flex;
            min-height: 100vh;
        }

        /* --- SPLASH SCREEN ANIMASI MASUK --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #4a148c;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
            animation: lunturLayar 0.6s ease 3.2s forwards;
        }

        .welcome-box {
            text-align: center;
            border: 3px solid #ffffff;
            padding: 25px 40px;
            background: rgba(0, 0, 0, 0.2);
            animation: wadahMuncul 1.5s ease-out forwards;
        }

        .welcome-text {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.4;
        }

        @keyframes wadahMuncul {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes lunturLayar {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; display: none !important; }
        }

        /* --- TATA LETAK UTAMA MENYAMPING SECARA PERMANEN --- */
        .wrapper {
            display: flex;
            flex-direction: row;
            width: 100%;
            flex: 1;
        }

        /* --- SIDEBAR KIRI --- */
        nav {
            width: 150px;
            background: #ffffff;
            padding: 15px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 2px solid #eaeaea;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .logo-box {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-box img {
            width: 55px;
            height: auto;
            border-radius: 50%;
            border: 2px solid #4a148c;
            padding: 2px;
        }

        .logo-box h2 {
            font-size: 0.85rem;
            color: #333333;
            margin-top: 5px;
            font-weight: 800;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        nav button {
            background: #764ba2;
            color: #ffffff;
            border: none;
            padding: 10px 5px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            width: 100%;
        }

        nav button i {
            width: 12px;
            text-align: center;
        }

        nav button:hover {
            background: #5e35b1;
        }

        nav button.active {
            background: #4a148c !important;
            box-shadow: 0 4px 8px rgba(74, 20, 140, 0.2);
        }

        /* --- AREA KONTEN UTAMA --- */
        .main-container {
            flex: 1;
            margin-left: 150px;
            padding: 15px;
            background: #ffffff;
            overflow-x: hidden;
        }

        .page-content {
            display: none;
            animation: efekPudar 0.4s ease-in-out forwards;
        }

        @keyframes efekPudar {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --- STRUKTUR PANEL GRID --- */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .title-main {
            font-size: 1.3rem;
            font-weight: 800;
            color: #111111;
            margin-bottom: 5px;
            border-bottom: 2px solid #764ba2;
            padding-bottom: 5px;
        }

        .subtitle-sec {
            font-size: 1.05rem;
            font-weight: 700;
            color: #4a148c;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        .text-desc {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #444444;
            text-align: justify;
            margin-bottom: 10px;
        }

        /* Grid Item Box */
        .kegiatan-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .kegiatan-card {
            background: #f9f9f9;
            border: 1px solid #eeeeee;
            padding: 10px 5px;
            border-radius: 6px;
            text-align: center;
        }

        .kegiatan-card i {
            font-size: 1.2rem;
            color: #4a148c;
            margin-bottom: 4px;
        }

        .kegiatan-card p {
            font-size: 0.7rem;
            font-weight: 700;
            color: #333333;
        }

        /* Kotak Gelap Khas Desain */
        .dark-box {
            background: #1e1b29;
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .dark-box h3 {
            color: #ffffff;
            font-size: 1rem;
            margin-bottom: 8px;
            border-left: 3px solid #764ba2;
            padding-left: 8px;
        }
