<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectra Event Organizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* --- ANIMASI WELCOME SPLASH SCREEN (ANTI-STUCK TOTAL) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
            box-sizing: border-box;
            animation: hapusSplash 0.5s ease 3.8s forwards;
            pointer-events: auto;
        }

        .welcome-text {
            font-size: 2.2rem; 
            font-weight: 800;
            color: #ffffff !important;
            letter-spacing: 4px;
            text-transform: uppercase; 
            text-align: center;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
            animation: gameIntro 2.3s ease-out forwards;
            opacity: 0;
            line-height: 1.4;
            max-width: 900px;
        }

        @keyframes gameIntro {
            0% { opacity: 0; transform: translateY(40px); filter: blur(10px); }
            60% { opacity: 1; filter: blur(0px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes hapusSplash {
            0% { opacity: 1; visibility: visible; }
            99% { opacity: 0; visibility: visible; }
            100% { opacity: 0; visibility: hidden; display: none !important; pointer-events: none; }
        }

        /* --- STYLING UTAMA WEB SPECTRA EO --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            background-color: #ffffff !important; /* Latar belakang luar PUTIH murni */
            color: #ffffff; 
            box-sizing: border-box;
        }

        /* --- STYLING SIDEBAR KIRI --- */
        nav {
            width: 260px;
            background: rgba(118, 75, 162, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid rgba(118, 75, 162, 0.2);
            position: fixed;
            height: 100vh;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Mengatur posisi dan ukuran Logo Perusahaan */
        .sidebar-logo {
            display: block;
            max-width: 100px; /* Ukuran lebar logo di sidebar */
            height: auto;
            margin: 0 auto 10px auto; /* Membuat posisi logo pas di tengah */
            border-radius: 8px; /* Sudut melengkung halus pada gambar */
        }

        .sidebar-brand {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(118, 75, 162, 0.2);
            padding-bottom: 15px;
            color: #4a148c; 
        }

        nav button {
            background: none;
            border: none;
            text-align: left;
            width: 100%;
            color: #4a148c; 
            font-family: inherit;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 12px;
            transition: 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1rem;
        }

        nav button i {
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }

        nav button:hover {
            background: rgba(118, 75, 162, 0.15);
            transform: translateX(5px);
        }

        nav button.active {
            background: #764ba2 !important; 
            color: #ffffff !important; 
        }

        /* --- KONTEN UTAMA & PAPAN TEKS HITAM --- */
        .main-content {
            margin-left: 260px; 
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 750px;
            padding: 2.5rem;
            background: #1a1a1a !important; /* PAPAN TENGAH HITAM PEKAT */
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

            display: none;
