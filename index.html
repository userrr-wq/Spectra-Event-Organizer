<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Spectra Jaya Abadi - Official Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* --- UTILITY RESET & DASAR --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #222222;
            min-height: 100vh;
        }

        /* --- SPLASH SCREEN (FIXED: WARNA HITAM & ANTI-MACET) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000; /* Latar belakang hitam pekat sesuai request, Seng */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
            /* Animasi luntur lalu hilang total dari layar */
            animation: lunturLayar 0.6s ease 2.5s forwards;
        }

        .welcome-box {
            text-align: center;
            border: 3px solid #ffffff; /* Kotak border putih biar kontras di latar hitam */
            padding: 25px 40px;
            background: rgba(255, 255, 255, 0.1);
            animation: wadahMuncul 1.2s ease-out forwards;
        }

        .welcome-text {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff; /* Tulisan putih murni */
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.4;
        }

        @keyframes wadahMuncul {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes lunturLayar {
            0% { opacity: 1; visibility: visible; }
            99% { opacity: 0; visibility: hidden; }
            100% { opacity: 0; visibility: hidden; display: none !important; z-index: -1; }
        }

        /* --- TATA LETAK UTAMA MENYAMPING --- */
        .wrapper {
            display: flex;
            width: 100%;
        }

        /* --- SIDEBAR KIRI FIX --- */
        nav {
            width: 120px;
            background: #ffffff;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 2px solid #eaeaea;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 99;
        }

        .logo-box {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-box img {
            width: 50px;
            height: auto;
            border-radius: 50%;
            border: 2px solid #4a148c;
            padding: 2px;
        }

        .logo-box h2 {
            font-size: 0.75rem;
            color: #333333;
            margin-top: 5px;
            font-weight: 800;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        nav a {
            background: #764ba2;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 3px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }

        nav a:hover, nav a:active {
            background: #4a148c;
        }

        /* --- AREA UTAMA KONTEN KANAN --- */
        .main-container {
            margin-left: 120px;
            flex-grow: 1;
            min-width: 0;
            padding: 15px;
            background: #ffffff;
        }

        /* --- LOGIKA PERPINDAHAN CSS :TARGET --- */
        .page-content {
            display: none;
            width: 100%;
            animation: efekPudar 0.4s ease-in-out forwards;
        }

        #beranda {
            display: block;
        }

        :target {
            display: block !important;
        }
        :target ~ #beranda {
            display: none !important;
        }
        #beranda:target {
            display: block !important;
        }

        @keyframes efekPudar {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --- STYLING ISI TEKS UTAMA --- */
        .title-main {
            font-size: 1.3rem;
            font-weight: 800;
            color: #111111;
            margin-bottom: 5px;
            border-bottom: 2px solid #764ba2;
            padding-bottom: 4px;
        }

        .subtitle-sec {
            font-size: 1rem;
            font-weight: 700;
            color: #4a148c;
            margin-top: 10px;
            margin-bottom: 6px;
        }

        .text-desc {
            font-size: 0.8rem;
            line-height: 1.5;
            color: #444444;
            text-align: justify;
            margin-bottom: 8px;
        }

        /* Grid Item Box Kegiatan */
        .kegiatan-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 6px;
        }

        .kegiatan-card {
            background: #f9f9f9;
            border: 1px solid #eeeeee;
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
        }

        .kegiatan-card i {
            font-size: 1.1rem;
